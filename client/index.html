<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Identity. One tagline, used once, in the one place a visitor sees it
      before signing in. Two taglines used to exist (README.md and
      docs/DESIGN.md) and every downstream surface had to guess which one it was
      quoting.

      The mark is a wax seal reduced to what survives rasterisation: an uneven
      pressed edge and a rim, nothing inside. Generated by tools/build-brand.mjs
      from the tokens, so it cannot advertise a colour the product stopped using.
    -->
    <title>PenPal</title>
    <meta name="description" content="A letter takes time. That is the feature. Self-hosted, end-to-end encrypted correspondence between exactly two people." />
    <meta name="application-name" content="PenPal" />

    <!-- Chrome colour, per scheme, so the browser UI matches the page it frames. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />

    <!--
      Icons, smallest-capable first is wrong here: a browser that understands SVG
      should never download a raster. The PNGs exist for the contexts that do not.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Social card. og:url is deliberately absent: this is a self-hosted
      application and the instance address is the operator's, not a canonical
      public URL to publish. Relative og:image resolves against the page it is
      shared from, which is the only URL that is ever correct here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PenPal" />
    <meta property="og:title" content="PenPal" />
    <meta property="og:description" content="A letter takes time. That is the feature." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A wax seal above the word PenPal" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PenPal" />
    <meta name="twitter:description" content="A letter takes time. That is the feature." />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      Fonts are self-hosted (see src/fonts.css, generated by tools/fetch-fonts.py).
      v0.0.2 linked fonts.googleapis.com, which the app's own CSP
      (`style-src 'self'`) blocked — so the typography silently fell back to system
      fonts in every real deployment, and nothing looked like the design at all.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>PenPal needs JavaScript to decrypt letters in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
