name: CI

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
    branches: [main, v2]

# Least privilege. Every job declares what it needs; the GITHUB_TOKEN is not
# allowed to write to the repo by default.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref, so a stale build
# cannot land after a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  lint:
    name: Lint & design tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Backend syntax
        run: npm run lint
      - name: Design token contrast gate
        run: npm run design:check
      - run: npm ci --prefix client
      - name: Client typecheck
        run: npx tsc --noEmit
        working-directory: client

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - name: Backend
        run: npm test
      - name: Client (crypto + chess perft)
        run: npm test --prefix client

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - name: Backend
        run: npm run build
      - name: Client
        run: npm run build --prefix client

  e2e:
    name: End-to-end (browser)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix client
      - name: Build client
        run: npm run build --prefix client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Playwright + chromium
        run: python3 -m pip install playwright && python3 -m playwright install --with-deps chromium

      # NODE_ENV must NOT be production: the server refuses to boot in prod
      # without a real non-default JWT_SECRET, and we do not want secrets in CI
      # logs. development + a fixed throwaway secret is the right shape.
      - name: Start server
        env:
          NODE_ENV: development
          JWT_SECRET: ci-e2e-only-not-a-real-secret-0123456789
          PORT: 3999
          DATA_DIR: ${{ runner.temp }}/penpal-e2e-data
        run: |
          mkdir -p "$DATA_DIR"
          node server/index.js &
          echo "PID=$!" >> "$GITHUB_ENV"

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3999/healthz; then
              echo "server healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy on :3999"
          exit 1

      - name: Run suite
        env:
          BASE_URL: http://localhost:3999
          E2E_PASSWORD: correct-horse-battery
          E2E_DATA_DIR: ${{ runner.temp }}/penpal-e2e-data
          E2E_SHOT_DIR: tests/e2e/screenshots
        run: npm run e2e

      - name: Stop server
        if: always()
        run: kill "$PID" 2>/dev/null || true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots-${{ github.sha }}
          path: tests/e2e/screenshots
          if-no-files-found: warn
          retention-days: 7

      # The suite asserts the plaintext is absent from this file, so it is the
      # single most useful artefact for debugging a failure.
      - name: Upload e2e database
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-database-${{ github.sha }}
          path: ${{ runner.temp }}/penpal-e2e-data/penpal.db
          if-no-files-found: warn
          retention-days: 7

  docker-build:
    name: Build image
    # Gated on E2E as well as build: an image that cannot complete a letter
    # round-trip has no business existing.
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pen-pal-archive:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish image
    needs: [docker-build]
    runs-on: ubuntu-latest
    # Main pushes get the rolling `latest` tag; a `v*` tag additionally gets a
    # semver tag. A release no longer needs a second workflow writing to the
    # same registry — two publishers is one too many.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max